<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores Amarillas para ti</title>
<style>
  :root{
    --bg: #fdfaf3;
    --ink: #4a3a22;
    --ink-soft: #7a6748;
    --gold: #f6c453;
    --gold-deep: #e8963a;
    --gold-center: #8a5a24;
    --trunk: #6b4a2b;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background: radial-gradient(ellipse at 50% 0%, #fffdf7 0%, var(--bg) 60%, #f7f1e2 100%);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    max-width: 1000px;
    margin: 0 auto;
    padding: 26px 18px 40px;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
  }

  /* ---------- bordes decorativos superior e inferior ---------- */
  .border-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 0 4px;
    height: 46px;
    opacity:0.95;
  }
  .border-row svg{ display:block; }

  /* ---------- contenedor principal: árbol + texto ----------
     Arranca centrado (el panel de texto no ocupa espacio), y cuando se
     agrega la clase "split" se expande con una transicion suave, lo que
     empuja el arbol hacia la derecha y el texto aparece a la izquierda. */
  .content{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 0px;
    flex-wrap: nowrap;
    padding: 10px 0;
    transition: gap 2.2s cubic-bezier(.45,0,.2,1);
  }
  .content.split{ gap: 20px; }

  .tree-col{
    flex: 0 1 auto;
    min-width: 0;
    order: 2;
    transition: transform 2.2s cubic-bezier(.45,0,.2,1);
  }

  .tree-wrap{
    position:relative;
    width: min(500px, 46vw);
    flex-shrink:1;
    cursor: pointer;
  }
  .tree-wrap.started{ cursor:default; }
  .tree-wrap svg{ width:100%; height:auto; display:block; overflow:visible; }

  .tap-hint{
    text-align:center;
    margin-top: -6px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    opacity: 0.85;
    animation: pulseHint 1.8s ease-in-out infinite;
    transition: opacity 0.5s ease;
  }
  .tap-hint.hidden{ opacity:0; pointer-events:none; }
  @keyframes pulseHint{
    0%,100%{ opacity:0.5; transform: translateY(0); }
    50%{ opacity:1; transform: translateY(-3px); }
  }

  .trunk-shape{
    fill: var(--trunk);
    stroke: none;
  }
  .bark-line{
    fill:none;
    stroke: #4a2f16;
    stroke-width: 1.1;
    stroke-linecap: round;
    opacity: 0.22;
  }
  .ground-shadow{
    fill: #3f2810;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .ground-shadow.visible{ opacity: 0.14; }
  .branch-path{
    fill:none;
    stroke: var(--trunk);
    stroke-linecap: round;
  }

  .seed{
    fill: #5a3d20;
  }
  .seed-glow{
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.4;
  }

  /* hojas cayendo, con vaiven de viento (no caen derecho: se mecen de lado a lado) */
  .leaves-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:visible;
  }
  .falling-leaf{
    position:absolute;
    top: var(--start-top, -8%);
    width:14px;
    height:9px;
    opacity:0;
    background-repeat:no-repeat;
    background-size:contain;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
    animation-play-state: paused;
  }
  .falling-leaf.active{ animation-play-state: running; }

  /* tres variantes de "viento" con distinto vaiven, para que no se vea repetitivo */
  @keyframes windFallA{
    0%{ top: var(--start-top, -8%); transform: translateX(0) rotate(-12deg); opacity:0; }
    6%{ opacity:0.95; }
    22%{ transform: translateX(30px) rotate(55deg); }
    44%{ transform: translateX(-20px) rotate(-35deg); }
    66%{ transform: translateX(34px) rotate(70deg); }
    86%{ transform: translateX(-14px) rotate(-18deg); opacity:0.9; }
    100%{ top: var(--end-top, 112%); transform: translateX(18px) rotate(95deg); opacity:0; }
  }
  @keyframes windFallB{
    0%{ top: var(--start-top, -8%); transform: translateX(0) rotate(10deg); opacity:0; }
    6%{ opacity:0.95; }
    26%{ transform: translateX(-34px) rotate(-55deg); }
    52%{ transform: translateX(22px) rotate(42deg); }
    76%{ transform: translateX(-28px) rotate(-48deg); opacity:0.9; }
    100%{ top: var(--end-top, 112%); transform: translateX(16px) rotate(24deg); opacity:0; }
  }
  @keyframes windFallC{
    0%{ top: var(--start-top, -8%); transform: translateX(0) rotate(0deg) scale(1); opacity:0; }
    6%{ opacity:0.9; }
    30%{ transform: translateX(42px) rotate(75deg) scale(0.92); }
    55%{ transform: translateX(-12px) rotate(-22deg) scale(1); }
    78%{ transform: translateX(36px) rotate(52deg) scale(0.94); opacity:0.85; }
    100%{ top: var(--end-top, 112%); transform: translateX(-8px) rotate(-12deg) scale(1); opacity:0; }
  }

  /* mecida continua y suave de toda la copa, como si el viento la moviera */
  .crown-sway{
    animation: crownSway 4.6s ease-in-out infinite;
    transform-box: view-box;
    transform-origin: 50% 59.5%;
  }
  @keyframes crownSway{
    0%, 100%{ transform: rotate(-1.6deg); }
    50%{ transform: rotate(1.8deg); }
  }

  /* el tronco acompana el vaiven, pero mucho mas leve y pivotando desde el
     suelo, para que la base quede plantada y solo se flexione hacia arriba */
  .trunk-sway{
    animation: trunkSway 4.6s ease-in-out infinite;
    transform-box: view-box;
    transform-origin: 50% 94.5%;
  }
  @keyframes trunkSway{
    0%, 100%{ transform: rotate(-0.55deg); }
    50%{ transform: rotate(0.62deg); }
  }

  /* la sombra del suelo respira apenas, acompanando el movimiento */
  .ground-shadow{
    animation: shadowBreathe 4.6s ease-in-out infinite;
    transform-box: view-box;
    transform-origin: 50% 95%;
  }
  @keyframes shadowBreathe{
    0%, 100%{ transform: scaleX(0.97); }
    50%{ transform: scaleX(1.04); }
  }

  /* ---------- panel de texto ----------
     Arranca sin ancho (colapsado) para que el arbol quede centrado;
     al agregar "split" en .content se expande de forma animada. */
  .text-panel{
    flex: 0 0 0;
    min-width: 0;
    max-width: 0;
    max-height: 0;
    padding: 8px 0;
    opacity: 0;
    overflow: hidden;
    order: 1;
    transition: flex-basis 2.2s cubic-bezier(.45,0,.2,1), max-width 2.2s cubic-bezier(.45,0,.2,1), max-height 2.2s cubic-bezier(.45,0,.2,1), padding 2.2s ease;
  }
  .content.split .text-panel{
    flex: 1 1 0;
    max-width: 440px;
    max-height: 3000px;
    padding: 8px 6px;
  }
  .text-inner{
    width: 100%;
  }
  .text-panel p{
    margin: 0 0 14px 0;
    line-height: 1.5;
  }
  .titulo{
    font-size: clamp(19px, 2.4vw, 23px);
    font-weight: 700;
    color: var(--ink);
  }
  .msg{
    font-size: clamp(16px, 2vw, 18px);
    color: var(--ink-soft);
    font-style: italic;
  }
  .firma{
    font-size: clamp(17px, 2.1vw, 19px);
    font-weight:700;
    color: var(--gold-deep);
  }

  .fade-item{
    opacity:0;
    transform: translateY(10px);
    will-change: opacity, transform;
  }

  /* ---------- contador ---------- */
  .counter-section{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid #e6d9bd;
  }
  .counter-label{
    font-size: clamp(14px, 1.8vw, 16px);
    color: var(--ink-soft);
    font-style: italic;
    margin-bottom: 10px !important;
  }
  .counter-display{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .counter-block{
    background: #fff9ec;
    border: 1px solid #ecdfba;
    border-radius: 10px;
    padding: 8px 10px;
    min-width: 56px;
    text-align:center;
    box-shadow: 0 2px 6px rgba(180,140,60,0.12);
  }
  .counter-block .num{
    font-family: Georgia, serif;
    font-size: 20px;
    font-weight:700;
    color: var(--gold-deep);
    display:block;
    overflow: hidden;
    position: relative;
  }
  .counter-block .num .num-inner{
    display:inline-block;
    will-change: transform, opacity;
  }
  .counter-block .num.tick .num-inner{
    animation: numTick 0.5s cubic-bezier(.22,1,.36,1);
  }
  @keyframes numTick{
    0%{ transform: translateY(-60%); opacity:0; }
    45%{ transform: translateY(6%); opacity:1; }
    100%{ transform: translateY(0); opacity:1; }
  }
  .counter-block .unit{
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  .music-toggle{
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 20;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #ecdfba;
    background: #fff9ec;
    box-shadow: 0 2px 8px rgba(180,140,60,0.18);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, opacity 0.4s ease;
    opacity: 0;
  }
  .music-toggle.visible{ display:flex; opacity: 1; }
  .music-toggle:active{ transform: scale(0.92); }

  .replay-link{
    display:block;
    text-align:center;
    margin-top: 18px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    opacity: 0;
    text-decoration: none;
    cursor:pointer;
    transition: opacity 0.6s ease;
  }
  .replay-link.visible{ opacity: 0.75; }
  .replay-link:hover{ opacity: 1; }

  /* En pantallas angostas NO se apila: el texto se mantiene al lado del
     arbol, solo se achican tipografias y espaciados para que quepa bien. */
  @media (max-width: 760px){
    .stage{ padding: 14px 10px 24px; }
    .content{ gap: 10px; }
    .tree-wrap{ width: min(500px, 44vw); }
    .text-panel{ padding: 4px 2px; }
    .text-panel p{ margin: 0 0 9px 0; line-height: 1.38; }
    .titulo{ font-size: clamp(12px, 3.1vw, 19px); }
    .msg{ font-size: clamp(10.5px, 2.7vw, 16px); }
    .firma{ font-size: clamp(11px, 2.8vw, 17px); }
    .counter-section{ margin-top: 10px; padding-top: 9px; }
    .counter-label{ font-size: clamp(10px, 2.4vw, 14px); margin-bottom: 7px !important; }
    .counter-display{ gap: 5px; }
    .counter-block{ padding: 5px 4px; min-width: 0; flex: 1 1 0; border-radius: 7px; }
    .counter-block .num{ font-size: clamp(11px, 3vw, 17px); }
    .counter-block .unit{ font-size: clamp(6.5px, 1.6vw, 9px); letter-spacing: 0; }
    .replay-link{ margin-top: 11px; font-size: 11px; }
    .tap-hint{ font-size: 12px; }
    .border-row{ height: 30px; }
  }

  @media (max-width: 420px){
    .counter-block{ padding: 4px 2px; }
    .titulo{ font-size: clamp(11px, 3.2vw, 15px); }
  }
</style>
</head>
<body>

<div class="stage">

  <!-- Reproductor de musica de fondo (opcional, ver CONFIG.musica) -->
  <audio id="bgMusic" loop preload="none"></audio>
  <button id="musicToggle" class="music-toggle" type="button" aria-label="Silenciar musica" title="Musica">🔇</button>

  <div class="border-row" id="borderTop"></div>

  <div class="content">
    <div class="tree-col">
      <div class="tree-wrap" id="treeWrap">
        <svg id="treeSvg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
          <g id="bigFlowerGroup"></g>
          <circle id="seedDot" class="seed" cx="150" cy="180" r="0" />
          <ellipse id="groundShadow" class="ground-shadow" cx="150" cy="380" rx="27" ry="6"></ellipse>
          <clipPath id="trunkClip"><rect id="trunkClipRect" x="100" y="378" width="100" height="0"></rect></clipPath>
          <g class="trunk-sway" clip-path="url(#trunkClip)">
            <path id="trunkShape" class="trunk-shape" d=""></path>
            <path id="barkLine1" class="bark-line" d=""></path>
            <path id="barkLine2" class="bark-line" d=""></path>
          </g>
          <g id="branchesGroup" class="crown-sway"></g>
          <g id="canopy" class="crown-sway"></g>
        </svg>
        <div class="leaves-layer" id="leavesLayer"></div>
      </div>
      <p class="tap-hint" id="tapHint">Toca la flor para comenzar</p>
    </div>

    <div class="text-panel" id="textPanel">
      <div class="text-inner" id="textInner">
      <p class="titulo fade-item" id="elTitulo"></p>
      <p class="msg fade-item" id="elMsg1"></p>
      <p class="msg fade-item" id="elMsg2"></p>
      <p class="msg fade-item" id="elMsg3"></p>
      <p class="firma fade-item" id="elFirma"></p>

      <div class="counter-section fade-item" id="elCounterSection">
        <p class="counter-label" id="elCounterLabel"></p>
        <div class="counter-display">
          <div class="counter-block"><span class="num" id="cYears"><span class="num-inner">0</span></span><span class="unit">Años</span></div>
          <div class="counter-block"><span class="num" id="cDays"><span class="num-inner">0</span></span><span class="unit">Días</span></div>
          <div class="counter-block"><span class="num" id="cHours"><span class="num-inner">00</span></span><span class="unit">Horas</span></div>
          <div class="counter-block"><span class="num" id="cMin"><span class="num-inner">00</span></span><span class="unit">Min</span></div>
          <div class="counter-block"><span class="num" id="cSec"><span class="num-inner">00</span></span><span class="unit">Seg</span></div>
        </div>
      </div>

      <a class="replay-link" id="replayLink"> Ver de nuevo</a>
      </div>
    </div>
  </div>

  <div class="border-row" id="borderBottom"></div>

</div>

<script>
/* ============================================================
   CONFIGURACIÓN — edita solo aquí, no necesitas tocar el resto
   ============================================================ */
const CONFIG = {
  titulo: "🌻 Para ti, mamá 🌻",

  mensajes: [
    "Hoy el mundo se viste de flores amarillas, y yo solo puedo pensar en ti, porque eres la que me enseñó a florecer.",
    "Gracias por cuidarme cuando no sabía cuidarme, por creer en mí cuando yo dudaba, y por darme un amor que no se cansa, no se acaba y siempre encuentra la manera de abrazarme. Todo lo bueno que hay en mí lleva tu huella.",
    "Ojalá este día te llene de sol, de ternura y de todo el cariño que tú regalas sin pedir nada a cambio. Eres el jardín más hermoso de mi vida."
  ],

  firma: "Feliz día de las flores amarillas, mamá 💛",

  contadorTexto: "Mi amor de hijo es desde hace...",

  // Fecha y hora en que "empezó" el contador (formato AAAA-MM-DDTHH:MM:SS)
  fechaInicio: "2007-11-12T00:00:00",

  // Colores
  colores: {
    petaloA: "#f6c453",
    petaloB: "#e8963a",
    centro: "#8a5a24"
  },

  // ------------------------------------------------------------
  // MÚSICA DE FONDO (opcional)
  // ------------------------------------------------------------
  // 1) Poné acá el link directo a un archivo de audio (termina en .mp3,
  //    .ogg o .m4a). Un link de YouTube o Spotify NO funciona: el
  //    navegador necesita el archivo de audio en sí.
  // 2) La forma más simple si vas a subir esto a GitHub: subí tu archivo
  //    de música a la misma carpeta del repositorio (por ejemplo
  //    "cancion.mp3") y poné acá solo el nombre: "cancion.mp3".
  //    También podés usar un link absoluto a un mp3 alojado en otro
  //    lado (tu propio hosting, Dropbox con /dl=1, etc).
  // 3) Usá siempre música que tengas derecho a usar (una canción tuya,
  //    libre de derechos, o con licencia para este uso).
  // 4) Si dejás musica.url vacío (""), el reproductor no aparece.
  musica: {
    url: "cancion.mp3",              // ej: "cancion.mp3"  o  "https://tusitio.com/cancion.mp3"
    volumen: 0.55,        // 0 (silencio) a 1 (volumen maximo)
    iniciarConElArbol: true  // true = arranca sola apenas se toca la flor
  }
};
/* ============================================================
   FIN DE LA CONFIGURACIÓN
   ============================================================ */

const svgNS = "http://www.w3.org/2000/svg";

// ---- Rellenar textos desde CONFIG ----
document.getElementById('elTitulo').textContent = CONFIG.titulo;
document.getElementById('elMsg1').textContent = CONFIG.mensajes[0] || "";
document.getElementById('elMsg2').textContent = CONFIG.mensajes[1] || "";
document.getElementById('elMsg3').textContent = CONFIG.mensajes[2] || "";
document.getElementById('elFirma').textContent = CONFIG.firma;
document.getElementById('elCounterLabel').textContent = CONFIG.contadorTexto;

// ---- Definiciones compartidas (gradientes) para dar volumen a los petalos ----
function installDefs(svgEl){
  const defs = document.createElementNS(svgNS, "defs");
  defs.innerHTML = `
    <radialGradient id="petalGradA" cx="32%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#fff1c2"/>
      <stop offset="45%" stop-color="${CONFIG.colores.petaloA}"/>
      <stop offset="100%" stop-color="${CONFIG.colores.petaloB}"/>
    </radialGradient>
    <radialGradient id="petalGradB" cx="32%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#ffe2a0"/>
      <stop offset="45%" stop-color="${CONFIG.colores.petaloB}"/>
      <stop offset="100%" stop-color="#c97a1f"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#a8712f"/>
      <stop offset="60%" stop-color="${CONFIG.colores.centro}"/>
      <stop offset="100%" stop-color="#4a2e10"/>
    </radialGradient>
    <radialGradient id="bigCenterGrad" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#c4914a"/>
      <stop offset="55%" stop-color="#8a5a24"/>
      <stop offset="100%" stop-color="#3f2810"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7a5a2a" flood-opacity="0.25"/>
    </filter>
  `;
  svgEl.appendChild(defs);
}

// ---- Utilidad: marcado de una flor (petalos alrededor del origen 0,0) ----
// 'variant' introduce pequenas irregularidades organicas entre flores
function flowerSVGMarkup(size, colA, colB, colC, petals){
  const r = size/2;
  const n = petals || 5;
  let out = "";
  for(let i=0;i<n;i++){
    const baseAng = (360/n)*i;
    const jitterAng = baseAng + (Math.random()*10-5);
    const len = r*0.62*(0.88+Math.random()*0.24);
    const wid = r*0.34*(0.85+Math.random()*0.3);
    const grad = i%2===0 ? "url(#petalGradA)" : "url(#petalGradB)";
    out += `<ellipse cx="0" cy="${-len}" rx="${wid}" ry="${len}" fill="${grad}" transform="rotate(${jitterAng})"/>`;
  }
  out += `<circle cx="0" cy="0" r="${r*0.27}" fill="url(#centerGrad)"/>`;
  return out;
}

// ---- Bordes decorativos (arriba y abajo) ----
function buildBorder(containerId, count){
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  for(let i=0;i<count;i++){
    const size = 20 + Math.random()*10;
    const svg = document.createElementNS(svgNS,"svg");
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);
    svg.setAttribute("viewBox", `${-size/2} ${-size/2} ${size} ${size}`);
    const g = document.createElementNS(svgNS,"g");
    g.setAttribute("transform", `rotate(${Math.random()*360})`);
    g.innerHTML = flowerSVGMarkup(size, CONFIG.colores.petaloA, CONFIG.colores.petaloB, CONFIG.colores.centro);
    svg.appendChild(g);
    el.appendChild(svg);
  }
}
installDefs(document.getElementById('treeSvg'));
buildBorder('borderTop', 16);
buildBorder('borderBottom', 16);

// ---- Girasol grande de la pantalla inicial ----
const bigFlowerGroup = document.getElementById('bigFlowerGroup');
function buildBigFlower(){
  bigFlowerGroup.innerHTML = "";
  const cx = 150, cy = 172, R = 82;

  // --- capa trasera de petalos (mas grandes, mas oscuros, para dar profundidad) ---
  const backCount = 15;
  const backG = document.createElementNS(svgNS,"g");
  backG.setAttribute("filter","url(#softShadow)");
  for(let i=0;i<backCount;i++){
    const ang = (360/backCount)*i + 12;
    const petal = document.createElementNS(svgNS,"ellipse");
    petal.setAttribute("cx", 0);
    petal.setAttribute("cy", -R*0.66);
    petal.setAttribute("rx", R*0.22);
    petal.setAttribute("ry", R*0.58);
    petal.setAttribute("fill", "url(#petalGradB)");
    petal.setAttribute("transform", `translate(${cx},${cy}) rotate(${ang})`);
    backG.appendChild(petal);
  }
  bigFlowerGroup.appendChild(backG);

  // --- capa frontal de petalos (mas brillantes, ligeramente mas pequenos, con jitter organico) ---
  const frontCount = 17;
  for(let i=0;i<frontCount;i++){
    const ang = (360/frontCount)*i + (Math.random()*6-3);
    const lenJ = R*0.56*(0.92+Math.random()*0.16);
    const widJ = R*0.185*(0.9+Math.random()*0.2);
    const petal = document.createElementNS(svgNS,"ellipse");
    petal.setAttribute("cx", 0);
    petal.setAttribute("cy", -lenJ);
    petal.setAttribute("rx", widJ);
    petal.setAttribute("ry", lenJ);
    petal.setAttribute("fill", "url(#petalGradA)");
    petal.setAttribute("transform", `translate(${cx},${cy}) rotate(${ang})`);
    bigFlowerGroup.appendChild(petal);
    // vena central sutil para dar textura al petalo
    const vein = document.createElementNS(svgNS,"line");
    const rad = ang*Math.PI/180;
    vein.setAttribute("x1", cx); vein.setAttribute("y1", cy);
    vein.setAttribute("x2", cx + Math.sin(rad)*lenJ*1.75);
    vein.setAttribute("y2", cy - Math.cos(rad)*lenJ*1.75);
    vein.setAttribute("stroke", "#c97a1f");
    vein.setAttribute("stroke-width","0.6");
    vein.setAttribute("opacity","0.35");
    bigFlowerGroup.appendChild(vein);
  }

  // --- centro con anillo y patron espiral real de semillas (angulo dorado 137.5 grados) ---
  const centerR = R*0.36;
  const ring = document.createElementNS(svgNS,"circle");
  ring.setAttribute("cx", cx); ring.setAttribute("cy", cy);
  ring.setAttribute("r", centerR*1.08);
  ring.setAttribute("fill", "#d9a94f");
  bigFlowerGroup.appendChild(ring);

  const center = document.createElementNS(svgNS,"circle");
  center.setAttribute("cx", cx); center.setAttribute("cy", cy);
  center.setAttribute("r", centerR);
  center.setAttribute("fill", "url(#bigCenterGrad)");
  bigFlowerGroup.appendChild(center);

  const goldenAngle = 137.5 * Math.PI/180;
  const seedCount = 90;
  for(let i=0;i<seedCount;i++){
    const a = i*goldenAngle;
    const d = centerR*0.92*Math.sqrt(i/seedCount);
    const sx = cx + Math.cos(a)*d;
    const sy = cy + Math.sin(a)*d;
    const seed = document.createElementNS(svgNS,"ellipse");
    seed.setAttribute("cx", sx);
    seed.setAttribute("cy", sy);
    seed.setAttribute("rx", 1.5);
    seed.setAttribute("ry", 2.1);
    seed.setAttribute("transform", `rotate(${a*180/Math.PI+90} ${sx} ${sy})`);
    seed.setAttribute("fill", i%3===0 ? "#3f2810" : "#5c3a17");
    seed.setAttribute("opacity", "0.85");
    bigFlowerGroup.appendChild(seed);
  }
  // pequeno brillo en el centro para dar volumen
  const shine = document.createElementNS(svgNS,"ellipse");
  shine.setAttribute("cx", cx-centerR*0.32); shine.setAttribute("cy", cy-centerR*0.35);
  shine.setAttribute("rx", centerR*0.3); shine.setAttribute("ry", centerR*0.18);
  shine.setAttribute("fill", "#fff3d0");
  shine.setAttribute("opacity", "0.35");
  bigFlowerGroup.appendChild(shine);
}
buildBigFlower();

const FLOWER_CENTER = {x:150, y:175}; // posicion del girasol / de donde cae la semilla

// ============================================================
// GENERACIÓN ORGÁNICA DEL ÁRBOL (algoritmo recursivo tipo fractal)
// ============================================================
const TRUNK_TOP = {x:150, y:250}; // debe coincidir con el extremo superior de #trunkPath
const TRUNK_BASE = {x:150, y:378}; // debe coincidir con el extremo inferior de #trunkPath (nivel del suelo)
const CANOPY_TARGET = {x:150, y:150}; // hacia donde "atraen" suavemente las ramas para formar la copa

function angleDiff(a,b){
  let d = b - a;
  while(d > Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  return d;
}

// ============================================================
// SILUETA DE CORAZÓN — igual que en el gif de referencia:
// la copa entera (no solo la atraccion de las ramas) debe
// dibujar un corazon relleno de flores, sin huecos.
// Se usa la curva parametrica clasica del corazon:
//   x(t) = 16 sin^3(t)
//   y(t) = 13 cos(t) - 5 cos(2t) - 2 cos(3t) - cos(4t)
// (en coordenadas SVG, y se invierte para que la punta quede abajo)
// ============================================================
const HEART_CENTER = { x: 150, y: 175 };
const HEART_SCALE = 6.15;

function heartPoint(t){
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return {
    x: HEART_CENTER.x + x * HEART_SCALE,
    y: HEART_CENTER.y - y * HEART_SCALE
  };
}

function buildHeartPolygon(steps){
  const pts = [];
  for(let i=0;i<=steps;i++){
    const t = (i/steps) * Math.PI * 2;
    pts.push(heartPoint(t));
  }
  return pts;
}

// ray casting: punto dentro del poligono del corazon
function pointInHeart(x, y, poly){
  let inside = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    const intersect = ((yi > y) !== (yj > y)) &&
      (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

const HEART_POLY = buildHeartPolygon(140);
const HEART_BOUNDS = HEART_POLY.reduce((b,p)=>({
  minX: Math.min(b.minX,p.x), maxX: Math.max(b.maxX,p.x),
  minY: Math.min(b.minY,p.y), maxY: Math.max(b.maxY,p.y)
}), {minX:Infinity, maxX:-Infinity, minY:Infinity, maxY:-Infinity});

function buildTree(){
  const branches = [];
  const flowerSpots = []; // {x,y, availableAt}

  function grow(x0, y0, angle, length, depth, startOffset){
    const growDur = 0.34 + Math.random()*0.18;
    const x1 = x0 + Math.cos(angle)*length;
    const y1 = y0 + Math.sin(angle)*length;

    branches.push({
      x0, y0, x1, y1, depth,
      growStart: startOffset,
      growDur,
      width: Math.max(1, 7 - depth*0.85)
    });

    const maxDepth = 6;
    const tooShort = length < 7;

    if(depth >= maxDepth || tooShort){
      // una flor "ancla" en cada punta de rama; el relleno denso que da
      // forma real al corazon se agrega despues, en una pasada aparte
      flowerSpots.push({ x:x1, y:y1, availableAt: startOffset + growDur, anchor:true });
      return;
    }

    const children = depth < 3 ? 2 : (Math.random() < 0.68 ? 2 : 1);
    for(let c=0;c<children;c++){
      const spread = 0.30 + Math.random()*0.34;
      const side = children === 1 ? (Math.random()<0.5?-1:1) : (c===0?-1:1);
      let childAngle = angle + side*spread;

      // atraccion hacia el centro del corazon, para que las ramas se
      // mantengan dentro de su silueta y no se salgan del contorno
      const targetAngle = Math.atan2(HEART_CENTER.y - y1, HEART_CENTER.x - x1);
      childAngle += angleDiff(childAngle, targetAngle) * 0.24;

      // pequena variacion aleatoria adicional para que no se vea repetitivo
      childAngle += (Math.random()-0.5)*0.12;

      const childLength = length * (0.68 + Math.random()*0.14);
      const childStart = startOffset + growDur*0.55 + Math.random()*0.12;

      grow(x1, y1, childAngle, childLength, depth+1, childStart);
    }
  }

  // varias ramas principales que arrancan del tronco, ligeramente inclinadas,
  // para una copa mas ancha y llena desde la base (se mantienen cortas y
  // contenidas: la forma real la define el relleno de corazon de abajo)
  grow(TRUNK_TOP.x, TRUNK_TOP.y, -Math.PI/2 - 0.26, 26, 0, 0.0);
  grow(TRUNK_TOP.x, TRUNK_TOP.y, -Math.PI/2 - 0.09, 27, 0, 0.06);
  grow(TRUNK_TOP.x, TRUNK_TOP.y, -Math.PI/2 + 0.09, 27, 0, 0.12);
  grow(TRUNK_TOP.x, TRUNK_TOP.y, -Math.PI/2 + 0.26, 26, 0, 0.18);
  grow(TRUNK_TOP.x, TRUNK_TOP.y, -Math.PI/2, 24, 0, 0.24);

  // ---------------------------------------------------------------
  // RELLENO DEL CORAZÓN — malla regular densa (no muestreo aleatorio),
  // asi queda cubierto por completo, sin huecos blancos. Se genera solo
  // la mitad derecha y se refleja a la izquierda, para que ambos lobulos
  // queden perfectamente parejos.
  // ---------------------------------------------------------------
  const FILL_DURATION = 1.7; // tiempo total en que "brota" el relleno, de abajo hacia arriba
  const { minX, maxX, minY, maxY } = HEART_BOUNDS;
  const cx = HEART_CENTER.x;

  // paso de la malla: mas chico = mas denso. Las flores miden ~14-28px,
  // asi que con paso ~7px cada flor se solapa con sus vecinas y no deja aire.
  const STEP_X = 7.0, STEP_Y = 6.4;
  const rowsN = Math.ceil((maxY - minY) / STEP_Y);
  const colsN = Math.ceil((maxX - cx) / STEP_X) + 1;

  for(let r=0;r<=rowsN;r++){
    const yBase = minY + r*STEP_Y;
    // desplazamiento alterno por fila (patron hexagonal) para que la malla
    // no se lea como una cuadricula y tape mejor los intersticios
    const rowOffset = (r % 2) * (STEP_X/2);
    const climb = clampNum((maxY - yBase) / (maxY - minY), 0, 1); // 0 abajo, 1 arriba
    const rowTime = climb * FILL_DURATION;

    for(let c=0;c<=colsN;c++){
      const xBase = cx + rowOffset + c*STEP_X;
      // jitter pequeno: da aspecto natural sin abrir huecos
      const jx = (Math.random()-0.5)*2.6;
      const jy = (Math.random()-0.5)*2.6;
      const x = xBase + jx;
      const y = yBase + jy;
      if(!pointInHeart(x, y, HEART_POLY)) continue;

      const t1 = rowTime + Math.random()*0.28;
      flowerSpots.push({ x, y, availableAt: t1, filler: true });

      // espejo hacia la izquierda (evitando duplicar la columna central)
      if(Math.abs(x - cx) > 0.9){
        const t2 = rowTime + Math.random()*0.28;
        flowerSpots.push({ x: 2*cx - x, y, availableAt: t2, filler: true });
      }
    }
  }

  // segunda capa mas gruesa y dispersa por encima, para dar volumen y
  // que no se note el patron de la malla
  const topLayer = 90;
  for(let i=0;i<topLayer;i++){
    const x = cx + Math.random()*(maxX-cx);
    const y = minY + Math.random()*(maxY-minY);
    if(!pointInHeart(x, y, HEART_POLY)) continue;
    const climb = clampNum((maxY - y) / (maxY - minY), 0, 1);
    const at = climb*FILL_DURATION + Math.random()*0.3;
    flowerSpots.push({ x, y, availableAt: at, filler: true, patch: true });
    flowerSpots.push({ x: 2*cx - x, y, availableAt: at + (Math.random()-0.5)*0.2, filler: true, patch: true });
  }

  return { branches, flowerSpots };
}
function clampNum(v, a, b){ return Math.max(a, Math.min(b, v)); }


// ---- Construir el DOM de ramas y flores a partir del arbol generado ----
const branchesGroup = document.getElementById('branchesGroup');
const canopy = document.getElementById('canopy');
let branchEls = [];
let flowerEls = [];
let maxTreeTime = 0;

function renderTree(){
  branchesGroup.innerHTML = "";
  canopy.innerHTML = "";
  branchEls = [];
  flowerEls = [];

  const { branches, flowerSpots } = buildTree();

  branches.forEach(b => {
    const path = document.createElementNS(svgNS, "path");
    // pequena curva sutil para que no se vea perfectamente recta
    const mx = (b.x0+b.x1)/2 + (Math.random()*6-3);
    const my = (b.y0+b.y1)/2 + (Math.random()*6-3);
    path.setAttribute("d", `M${b.x0},${b.y0} Q${mx},${my} ${b.x1},${b.y1}`);
    path.setAttribute("class","branch-path");
    path.setAttribute("stroke-width", b.width.toFixed(2));
    branchesGroup.appendChild(path);
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    branchEls.push({ el: path, len, growStart: b.growStart, growDur: b.growDur });
    maxTreeTime = Math.max(maxTreeTime, b.growStart + b.growDur);
  });

  flowerSpots.forEach(f => {
    const size = f.patch ? (13 + Math.random()*10) : (f.filler ? (8 + Math.random()*8) : (15 + Math.random()*13));
    const petals = Math.random() < 0.5 ? 5 : 6;
    const g = document.createElementNS(svgNS, "g");
    g.innerHTML = flowerSVGMarkup(size, CONFIG.colores.petaloA, CONFIG.colores.petaloB, CONFIG.colores.centro, petals);
    canopy.appendChild(g);
    const rot = Math.random()*360;
    const appear = f.availableAt + Math.random()*0.25;
    const growDur = 0.4 + Math.random()*0.25;
    g.setAttribute("transform", `translate(${f.x},${f.y}) rotate(${rot}) scale(0)`);
    flowerEls.push({ el: g, x: f.x, y: f.y, rot, appear, growDur });
    maxTreeTime = Math.max(maxTreeTime, appear + growDur);
  });
}

// ---- Tronco: forma solida que se afina de la base hacia arriba, con la
// base ensanchandose suavemente (como un arbol real) y lineas de corteza ----
const trunkShapeEl = document.getElementById('trunkShape');
const trunkClipRect = document.getElementById('trunkClipRect');
const barkLines = [document.getElementById('barkLine1'), document.getElementById('barkLine2')];
const groundShadowEl = document.getElementById('groundShadow');
const TRUNK_DUR = 1.25;

// perfil de ancho: ancho en la base (flare) y angosto arriba
function trunkHalfWidth(u){
  // u: 0 = base (suelo), 1 = arriba (donde arrancan las ramas)
  const slim = 4.6 + (12.4 - 4.6) * Math.pow(1-u, 1.3); // afinado principal (mas grueso, mas proporcionado a la copa)
  const flare = 10.6 * Math.pow(Math.max(0, 1 - u/0.17), 2.3); // ensanche solo muy cerca del suelo
  return slim + flare;
}

function buildTrunkShape(){
  const yBase = TRUNK_BASE.y, yTop = TRUNK_TOP.y;
  const steps = 40;
  const leftPts = [], rightPts = [], centers = [];
  for(let i=0;i<=steps;i++){
    const u = i/steps;
    const y = yBase + (yTop - yBase)*u;
    // leve serpenteo del eje para que no sea un poste perfectamente recto
    const cx = TRUNK_BASE.x + Math.sin(u*Math.PI*1.15)*2.2 - u*1.2;
    const hw = trunkHalfWidth(u);
    centers.push({x:cx, y, hw});
    leftPts.push({x: cx-hw, y});
    rightPts.push({x: cx+hw, y});
  }
  let d = `M${leftPts[0].x.toFixed(2)},${leftPts[0].y.toFixed(2)} `;
  for(let i=1;i<leftPts.length;i++) d += `L${leftPts[i].x.toFixed(2)},${leftPts[i].y.toFixed(2)} `;
  for(let i=rightPts.length-1;i>=0;i--) d += `L${rightPts[i].x.toFixed(2)},${rightPts[i].y.toFixed(2)} `;
  trunkShapeEl.setAttribute('d', d + 'Z');

  // dos lineas de corteza que siguen el eje, a distinta distancia del centro
  [0.42, -0.5].forEach((frac, idx) => {
    let bd = "";
    centers.forEach((c,i) => {
      const x = c.x + c.hw*frac*0.85;
      bd += (i===0 ? 'M' : 'L') + x.toFixed(2) + ',' + c.y.toFixed(2) + ' ';
    });
    barkLines[idx].setAttribute('d', bd);
  });
}
buildTrunkShape();

// ---- Semilla ----
const seedDot = document.getElementById('seedDot');

// ---- Flores y hojas cayendo juntas, con vaiven de viento ----
// IMPORTANTE: las flores que caen son copias nuevas creadas solo para la
// animacion de caida (renderizadas en su propia capa). El arbol real
// (flowerEls) nunca pierde flores: la copa se queda siempre completa.
const leavesLayer = document.getElementById('leavesLayer');
const WIND_VARIANTS = ['windFallA', 'windFallB', 'windFallC'];
const LEAF_COLORS = ['#7a9a4a', '#8fae55', '#a9c264', '#6f8f3f', '#c9a227', '#b6902a'];

function fallingFlowerURI(colA, colB, colC){
  const petals = [0,72,144,216,288].map((ang,i) => {
    const c = i%2===0 ? colA : colB;
    return `<ellipse cx="20" cy="9" rx="4.2" ry="8.6" fill="${c}" transform="rotate(${ang} 20 20)"/>`;
  }).join('');
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'>`+
    petals +
    `<circle cx="20" cy="20" r="4.6" fill="${colC}"/>`+
    `</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

function leafBackgroundURI(fill){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 24'>`+
    `<path d='M2,12 C5,3 34,2 38,12 C34,22 5,21 2,12 Z' fill='${fill}'/>`+
    `<path d='M4,12 C14,10 26,10 36,12' stroke='rgba(0,0,0,0.22)' stroke-width='1' fill='none'/>`+
    `</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

// rango horizontal/vertical aproximado que ocupa la copa en forma de
// corazon (en % del contenedor), para que las flores parezcan desprenderse
// de ahi y no aparecer de la nada arriba de toda la pantalla
const CANOPY_LEFT_PCT = 15, CANOPY_RIGHT_PCT = 85;
const CANOPY_TOP_PCT = 20, CANOPY_BOTTOM_PCT = 62;

function buildLeaves(){
  leavesLayer.innerHTML = "";
  for(let i=0;i<22;i++){
    const l = document.createElement('div');
    l.className = 'falling-leaf';
    const isFlower = i % 2 === 0; // mitad flores, mitad hojas, alternadas

    if(isFlower){
      const size = 12 + Math.random()*10;
      const colA = Math.random()<0.5 ? CONFIG.colores.petaloA : CONFIG.colores.petaloB;
      const colB = Math.random()<0.5 ? CONFIG.colores.petaloB : CONFIG.colores.petaloA;
      l.style.width = size+'px';
      l.style.height = size+'px';
      l.style.backgroundImage = fallingFlowerURI(colA, colB, CONFIG.colores.centro);
      // las flores nacen dentro de la copa, como si se desprendieran de ahi
      l.style.left = (CANOPY_LEFT_PCT + Math.random()*(CANOPY_RIGHT_PCT-CANOPY_LEFT_PCT))+'%';
      const startTop = CANOPY_TOP_PCT + Math.random()*(CANOPY_BOTTOM_PCT-CANOPY_TOP_PCT);
      l.style.setProperty('--start-top', startTop+'%');
    } else {
      const w = 12 + Math.random()*9;
      const h = w * (0.55 + Math.random()*0.15);
      const color = LEAF_COLORS[Math.floor(Math.random()*LEAF_COLORS.length)];
      l.style.width = w+'px';
      l.style.height = h+'px';
      l.style.backgroundImage = leafBackgroundURI(color);
      // las hojas caen en todo el ancho, desde arriba, como viento de fondo
      l.style.left = (Math.random()*94)+'%';
      l.style.setProperty('--start-top', '-8%');
    }

    l.style.setProperty('--end-top', '112%');
    l.style.animationName = WIND_VARIANTS[Math.floor(Math.random()*WIND_VARIANTS.length)];
    // caida mas lenta y con mas vaiven que un petalo simple, para que se note el viento
    l.style.animationDuration = (6 + Math.random()*5)+'s';
    l.style.animationDelay = (Math.random()*7)+'s';
    leavesLayer.appendChild(l);
  }
}
buildLeaves();

// ---- Contador en tiempo real (siempre exacto, independiente de la animacion) ----
const startDate = new Date(CONFIG.fechaInicio);
function pad(n){ return String(n).padStart(2,'0'); }

// actualiza un bloque del contador con una pequena animacion "tick" solo
// cuando el valor realmente cambia, para que se sienta natural y no un
// salto seco cada segundo
const counterCache = {};
function setCounterValue(id, value){
  if(counterCache[id] === value) return;
  counterCache[id] = value;
  const el = document.getElementById(id);
  const inner = el.querySelector('.num-inner');
  inner.textContent = value;
  el.classList.remove('tick');
  void el.offsetWidth; // fuerza reflow para poder reiniciar la animacion
  el.classList.add('tick');
}

function updateCounter(){
  const now = new Date();
  let diffMs = now - startDate;
  if(diffMs < 0) diffMs = 0;
  const totalSeconds = Math.floor(diffMs/1000);
  const years = Math.floor(totalSeconds / (365*24*3600));
  const remAfterYears = totalSeconds - years*365*24*3600;
  const days = Math.floor(remAfterYears / (24*3600));
  const hours = Math.floor((remAfterYears % (24*3600)) / 3600);
  const minutes = Math.floor((remAfterYears % 3600) / 60);
  const seconds = remAfterYears % 60;
  setCounterValue('cYears', years);
  setCounterValue('cDays', days);
  setCounterValue('cHours', pad(hours));
  setCounterValue('cMin', pad(minutes));
  setCounterValue('cSec', pad(seconds));
}
updateCounter();
setInterval(updateCounter, 1000);

// ============================================================
// SECUENCIA PRINCIPAL (una sola vez, disparada al tocar la flor)

function clamp01(v){ return Math.max(0, Math.min(1, v)); }
function easeOutCubic(p){ return 1 - Math.pow(1-p, 3); }
function easeInCubic(p){ return p*p*p; }

let sequenceStarted = false;
let rafId = null;

function playSequence(){
  if(sequenceStarted) return;
  sequenceStarted = true;

  if(CONFIG.musica && CONFIG.musica.iniciarConElArbol){
    startMusic();
  }

  const tapHintEl = document.getElementById('tapHint');
  tapHintEl.classList.add('hidden');
  tapHintEl.style.animation = 'none';
  tapHintEl.style.display = 'none';
  document.getElementById('treeWrap').classList.add('started');

  renderTree(); // genera un arbol organico (aleatorio) nuevo cada vez

  const SEED_FALL_START = 0.0;
  const SEED_FALL_DUR = 1.05;
  const TRUNK_START = 0.85;
  const BRANCH_ROOT_START = TRUNK_START + TRUNK_DUR * 0.62;

  // los tiempos de ramas/flores generados en renderTree() son relativos al
  // inicio de las ramas; los desplazamos para que empiecen en BRANCH_ROOT_START
  branchEls.forEach(b => b.growStart += BRANCH_ROOT_START);
  flowerEls.forEach(f => f.appear += BRANCH_ROOT_START);

  const leavesStartAt = BRANCH_ROOT_START + 1.3;

  const totalFlowerTime = flowerEls.reduce((m,f) => Math.max(m, f.appear + f.growDur), 0);
  const totalBranchTime = branchEls.reduce((m,b) => Math.max(m, b.growStart + b.growDur), 0);
  const canopyDoneAt = Math.max(totalFlowerTime, totalBranchTime);

  const textStart = canopyDoneAt + 0.5;
  const textItems = [
    { el: document.getElementById('elTitulo'), appear: textStart },
    { el: document.getElementById('elMsg1'), appear: textStart + 1.2 },
    { el: document.getElementById('elMsg2'), appear: textStart + 2.3 },
    { el: document.getElementById('elMsg3'), appear: textStart + 3.4 },
    { el: document.getElementById('elFirma'), appear: textStart + 4.5 },
    { el: document.getElementById('elCounterSection'), appear: textStart + 5.6 }
  ];
  const replayAppear = textStart + 6.8;
  const totalDuration = replayAppear + 0.8;

  document.getElementById('textPanel').style.opacity = 1;
  const contentEl = document.querySelector('.content');
  const textPanelEl = document.getElementById('textPanel');
  const textInnerEl = document.getElementById('textInner');
  let splitTriggered = false;

  // Antes de animar el ancho del panel, medimos cual sera su ancho FINAL
  // (aplicando la clase "split" sin transicion, midiendo, y revirtiendo al
  // instante) y lo fijamos en el contenido interno. Asi el texto ya queda
  // envuelto (wrap) en su forma definitiva desde el primer frame, y la
  // animacion solo "revela" ese contenido en vez de ir recalculando el
  // salto de linea a cada momento — que es lo que provocaba el salto
  // brusco de alto (y el arbol "brincando") a mitad de la transicion.
  function triggerSplit(){
    const prevTransition = textPanelEl.style.transition;
    textPanelEl.style.transition = 'none';
    contentEl.classList.add('split');
    void textPanelEl.offsetWidth; // forzar reflow con el estado final
    const finalWidth = textInnerEl.getBoundingClientRect().width;
    contentEl.classList.remove('split');
    void textPanelEl.offsetWidth; // forzar reflow de vuelta al estado colapsado
    textPanelEl.style.transition = prevTransition;
    textInnerEl.style.width = finalWidth + 'px';
    requestAnimationFrame(() => { contentEl.classList.add('split'); });
  }

  let leavesActivated = false;
  const startTime = performance.now();

  function frame(now){
    const t = (now - startTime) / 1000;

    // cuando el arbol termina de crecer, disparamos la transicion que
    // expande el panel de texto y empuja el arbol hacia la derecha
    if(!splitTriggered && t >= canopyDoneAt){
      triggerSplit();
      splitTriggered = true;
    }

    // girasol se desvanece
    const flowerFadeP = clamp01(t / 0.5);
    bigFlowerGroup.setAttribute('opacity', 1 - flowerFadeP);

    // semilla cae desde el centro de la flor hasta la base del tronco
    const seedP = clamp01((t - SEED_FALL_START) / SEED_FALL_DUR);
    if(seedP > 0 && seedP < 1){
      const eased = easeInCubic(seedP);
      const sx = FLOWER_CENTER.x;
      const sy = FLOWER_CENTER.y + (378 - FLOWER_CENTER.y) * eased;
      seedDot.setAttribute('cx', sx);
      seedDot.setAttribute('cy', sy);
      seedDot.setAttribute('r', 3.2);
      seedDot.setAttribute('opacity', 1);
    } else if(seedP >= 1){
      // pequeno rebote al aterrizar
      const bounceP = clamp01((t - (SEED_FALL_START+SEED_FALL_DUR)) / 0.3);
      const bounceScale = 1 + Math.sin(bounceP*Math.PI) * 0.5 * (1-bounceP);
      seedDot.setAttribute('cx', 150);
      seedDot.setAttribute('cy', 378);
      seedDot.setAttribute('r', (3.2*bounceScale).toFixed(2));
      seedDot.setAttribute('opacity', Math.max(0, 1 - clamp01((t-(SEED_FALL_START+SEED_FALL_DUR+0.4))/0.6)));
    } else {
      seedDot.setAttribute('opacity', 0);
    }

    // tronco: se revela de abajo hacia arriba con una mascara que sube,    // asi la forma solida (con base ensanchada) aparece creciendo del suelo
    const trunkP = easeOutCubic(clamp01((t - TRUNK_START) / TRUNK_DUR));
    const trunkSpan = TRUNK_BASE.y - TRUNK_TOP.y;
    trunkClipRect.setAttribute('y', (TRUNK_BASE.y - trunkSpan*trunkP).toFixed(2));
    trunkClipRect.setAttribute('height', (trunkSpan*trunkP + 4).toFixed(2));
    if(t >= TRUNK_START){
      groundShadowEl.classList.add('visible');
    }

    // ramas
    branchEls.forEach(b => {
      const p = easeOutCubic(clamp01((t - b.growStart) / b.growDur));
      b.el.style.strokeDashoffset = b.len * (1 - p);
    });

    // flores de la copa
    flowerEls.forEach(f => {
      const p = easeOutCubic(clamp01((t - f.appear) / f.growDur));
      f.el.setAttribute('transform', `translate(${f.x},${f.y}) rotate(${f.rot}) scale(${p})`);
    });

    // hojas cayendo
    if(!leavesActivated && t >= leavesStartAt){
      leavesActivated = true;
      leavesLayer.querySelectorAll('.falling-leaf').forEach(p => p.classList.add('active'));
    }

    // texto progresivo
    textItems.forEach(item => {
      const p = clamp01((t - item.appear) / 0.9);
      item.el.style.opacity = p;
      item.el.style.transform = `translateY(${(1-p)*10}px)`;
    });

    // enlace "ver de nuevo"
    const replayP = clamp01((t - replayAppear) / 0.8);
    document.getElementById('replayLink').style.opacity = replayP * 0.75;
    if(replayP > 0) document.getElementById('replayLink').classList.add('visible');

    if(t < totalDuration){
      rafId = requestAnimationFrame(frame);
    } else {
      rafId = null; // secuencia terminada: queda todo fijo, el contador sigue vivo por su propio intervalo
    }
  }
  rafId = requestAnimationFrame(frame);
}

function resetScene(){
  if(rafId) cancelAnimationFrame(rafId);
  sequenceStarted = false;

  bigFlowerGroup.setAttribute('opacity', 1);
  seedDot.setAttribute('opacity', 0);
  seedDot.setAttribute('r', 0);
  trunkClipRect.setAttribute('y', TRUNK_BASE.y);
  trunkClipRect.setAttribute('height', 0);
  groundShadowEl.classList.remove('visible');
  branchesGroup.innerHTML = "";
  canopy.innerHTML = "";
  buildLeaves();
  document.querySelector('.content').classList.remove('split');
  document.getElementById('textInner').style.width = '';

  document.getElementById('textPanel').style.opacity = 0;
  document.querySelectorAll('.fade-item').forEach(el => {
    el.style.opacity = 0;
    el.style.transform = 'translateY(10px)';
  });
  document.getElementById('replayLink').style.opacity = 0;
  document.getElementById('replayLink').classList.remove('visible');

  const tapHintEl2 = document.getElementById('tapHint');
  tapHintEl2.classList.remove('hidden');
  tapHintEl2.style.animation = '';
  tapHintEl2.style.display = '';
  document.getElementById('treeWrap').classList.remove('started');
}

document.getElementById('treeWrap').addEventListener('click', playSequence);
document.getElementById('tapHint').addEventListener('click', playSequence);
document.getElementById('replayLink').addEventListener('click', (e) => {
  e.preventDefault();
  resetScene();
});
</script>
</body>
